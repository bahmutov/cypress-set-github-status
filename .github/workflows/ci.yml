name: ci
on:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-24.04

    permissions:
      # allow the release step to comment on
      # issues, pull requests, and write to the repo
      contents: write
      issues: write
      pull-requests: write
      # Required for OIDC to let NPM registry know
      # that this workflow is trusted
      id-token: write

    steps:
      # important: the default Node version is v18
      # which gives us an auth error trying to release
      # so install v24 explicitly
      - name: Setup Node.js v24 🟢
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Checkout 🛎
        uses: actions/checkout@v7

      - name: Print GITHUB variables 🖨
        run: npx @bahmutov/print-env GITHUB

      - name: Install dependencies 📦
        # https://github.com/cypress-io/github-action
        uses: cypress-io/github-action@v6
        with:
          runTests: false

      - name: Set common status 🎬
        run: |
          node ./bin/set-gh-status --owner bahmutov --repo cypress-set-github-status \
            --sha $GITHUB_SHA --status pending \
            --context "Cypress E2E tests" --description "Running tests..."
        env:
          # this token is not tied to any repository
          # and can be used to set the commit status in the repos I have access to
          PERSONAL_GH_TOKEN: ${{ secrets.PERSONAL_GH_TOKEN }}
          DEBUG: cypress-set-github-status

      - name: Run tests 🧪
        # https://github.com/cypress-io/github-action
        uses: cypress-io/github-action@v6
        with:
          install: false
        env:
          # this token is not tied to any repository
          # and can be used to set the commit status in the repos I have access to
          PERSONAL_GH_TOKEN: ${{ secrets.PERSONAL_GH_TOKEN }}
          # update the common status after finishing the tests
          COMMON_STATUS: 'Cypress E2E tests'

      - name: Semantic Release 🚀
        if: github.ref == 'refs/heads/main'
        # https://github.com/cycjimmy/semantic-release-action
        uses: cycjimmy/semantic-release-action@v8
        with:
          branches: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
